name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require staging database URL
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::STAGING_DATABASE_URL secret is missing or empty. Integration tests need a Neon connection string."
            exit 1
          fi
          case "${DATABASE_URL}" in
            *neon.tech*) ;;
            *)
              echo "::error::STAGING_DATABASE_URL must be a Neon URL (host contains neon.tech)."
              exit 1
              ;;
          esac
          
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
