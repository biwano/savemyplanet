name: Migrate production database

# Run only after CI succeeds on main (push), not in parallel with tests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect schema or migration changes
        id: changes
        run: |
          if git diff --name-only --diff-filter=ACMR HEAD^ HEAD \
            | grep -Eq '^(apps/backend/drizzle/|apps/backend/src/db/schema/|apps/backend/drizzle\.config\.ts)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no schema/migration changes)
        if: steps.changes.outputs.needed != 'true'
        run: echo "No drizzle/schema changes in this commit; skipping migrate."

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.needed == 'true'
        with:
          version: 9.7.1

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.needed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Migrate
        if: steps.changes.outputs.needed == 'true'
        working-directory: apps/backend
        run: pnpm db:migrate
        env:
          # Prefer a direct (non-pooler) Neon URL for drizzle-kit migrate.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
